name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Conflict + injection tests (offline, real Postgres)
        env:
          TRIBUTARY_OFFLINE: "1"
        run: pytest tests/ -v

      - name: Eval harness — offline tier, regression gate
        run: python -m evals.run_eval --tier offline --check-baseline
