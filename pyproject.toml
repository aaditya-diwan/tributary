[project]
name = "tributary"
version = "0.1.0"
description = "Shared, persistent, conflict-safe memory for AI agents on CockroachDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.6"]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tributary"]
